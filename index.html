<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Extreme City Drive</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #82b7e8;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* START SCREEN */

        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #050b16;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 15px;
        }

        #startScreen img {
            width: 90%;
            max-width: 850px;
            max-height: 65vh;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 110, 255, 0.5);
        }

        #startScreen h1 {
            font-size: clamp(25px, 5vw, 48px);
            margin: 15px 0 5px;
            letter-spacing: 3px;
        }

        #startScreen p {
            font-size: 18px;
            letter-spacing: 6px;
            margin: 5px 0 20px;
            color: #55aaff;
        }

        #startButton {
            padding: 15px 45px;
            background: #0875e8;
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #startButton:hover {
            background: #0055bb;
        }

        /* MOBILE CONTROLS */

        #mobileControls {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            user-select: none;
        }

        .controlGroup {
            position: absolute;
            bottom: 22px;
            display: flex;
            gap: 12px;
            align-items: center;
            pointer-events: auto;
        }

        #steeringControls {
            left: 16px;
        }

        #drivingControls {
            right: 16px;
            flex-direction: column;
        }

        .controlButton {
            width: 66px;
            height: 66px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 18px;
            background: rgba(10,20,35,0.72);
            color: white;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .controlButton.active {
            background: rgba(0,110,255,0.9);
            transform: scale(0.95);
        }

        #gasButton {
            background: rgba(0,145,55,0.85);
        }

        #brakeButton {
            background: rgba(190,35,35,0.85);
        }

        @media (min-width: 900px) and (pointer: fine) {
            #mobileControls {
                opacity: 0.82;
            }

            .controlButton {
                width: 58px;
                height: 58px;
            }
        }

        @media (max-width: 380px) {
            .controlButton {
                width: 55px;
                height: 55px;
                border-radius: 14px;
            }

            .controlGroup {
                gap: 8px;
                bottom: 14px;
            }

            #steeringControls {
                left: 10px;
            }

            #drivingControls {
                right: 10px;
            }
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <!-- START SCREEN -->

    <div id="startScreen">

        <img
            src="./Bugatti_Chiron_driving_in_city_9fbc31f0_2K.jpg"
            alt="Bugatti Chiron">

        <h1>BUGATTI CHIRON</h1>

        <p>CITY DRIVE</p>

        <button id="startButton" type="button">
            START GAME
        </button>

    </div>

    <!-- MOBILE CONTROLS -->

    <div id="mobileControls">

        <div class="controlGroup" id="steeringControls">

            <button class="controlButton"
                    id="leftButton"
                    type="button"
                    aria-label="Steer left">◀</button>

            <button class="controlButton"
                    id="rightButton"
                    type="button"
                    aria-label="Steer right">▶</button>

        </div>

        <div class="controlGroup" id="drivingControls">

            <button class="controlButton"
                    id="gasButton"
                    type="button"
                    aria-label="Accelerate">▲</button>

            <button class="controlButton"
                    id="brakeButton"
                    type="button"
                    aria-label="Brake or reverse">▼</button>

        </div>

    </div>

    <!-- GAME SCRIPT -->

    <script type="module" src="./game.js"></script>

    <script>
        document.getElementById("startButton")
            .addEventListener("click", function () {

                document.getElementById("startScreen").style.display = "none";

            });
    </script>

</body>
</html>
