```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Extreme City Drive</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #82b7e8;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #mobileControls {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            user-select: none;
        }

        .controlGroup {
            position: absolute;
            bottom: 22px;
            display: flex;
            gap: 12px;
            align-items: center;
            pointer-events: auto;
        }

        #steeringControls {
            left: 16px;
        }

        #drivingControls {
            right: 16px;
            flex-direction: column;
        }

        .controlButton {
            width: 66px;
            height: 66px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 18px;
            background: rgba(10,20,35,0.72);
            color: white;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .controlButton.active {
            background: rgba(0,110,255,0.9);
            transform: scale(0.95);
        }

        #gasButton {
            background: rgba(0,145,55,0.85);
        }

        #brakeButton {
            background: rgba(190,35,35,0.85);
        }

        #extraControls {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .smallButton {
            min-width: 58px;
            height: 42px;
            padding: 0 10px;
            border: 1px solid white;
            border-radius: 12px;
            background: rgba(10,20,35,0.75);
            color: white;
            font-size: 13px;
            font-weight: bold;
            touch-action: manipulation;
        }

        @media (min-width: 900px) and (pointer: fine) {
            #mobileControls {
                opacity: 0.82;
            }

            .controlButton {
                width: 58px;
                height: 58px;
            }
        }

        @media (max-width: 380px) {
            .controlButton {
                width: 55px;
                height: 55px;
                border-radius: 14px;
            }

            .controlGroup {
                gap: 8px;
                bottom: 14px;
            }

            #steeringControls {
                left: 10px;
            }

            #drivingControls {
                right: 10px;
            }
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <div id="mobileControls">

        <div id="extraControls">
            <button class="smallButton" id="cameraButton"
                    type="button">CAMERA</button>

            <button class="smallButton" id="nightButton"
                    type="button">NIGHT</button>
        </div>

        <div class="controlGroup" id="steeringControls">
            <button class="controlButton" id="leftButton"
                    type="button" aria-label="Steer left">◀</button>

            <button class="controlButton" id="rightButton"
                    type="button" aria-label="Steer right">▶</button>
        </div>

        <div class="controlGroup" id="drivingControls">
            <button class="controlButton" id="gasButton"
                    type="button" aria-label="Accelerate">▲</button>

            <button class="controlButton" id="brakeButton"
                    type="button" aria-label="Brake or reverse">▼</button>
        </div>

    </div>

    <script type="module" src="./game.js"></script>

</body>
</html>
```
