<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BUGATTI CHIRON CITY DRIVE</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #050816;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

/* MAIN MENU */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;

    background:
    linear-gradient(
        90deg,
        rgba(2,5,15,0.95),
        rgba(2,5,15,0.55)
    ),
    url("./Bugatti_Chiron_driving_in_city_9fbc31f0_2K.jpg");

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
    padding: 8%;
}

.menuContent {
    color: white;
    max-width: 500px;
}

.smallTitle {
    color: #168cff;
    letter-spacing: 7px;
    font-size: 14px;
    margin-bottom: 15px;
}

h1 {
    font-size: 65px;
    line-height: 1;
    font-weight: 900;
    text-shadow: 0 0 20px #0077ff;
}

.subtitle {
    color: #b8c7df;
    letter-spacing: 5px;
    margin-top: 15px;
    margin-bottom: 35px;
}

.menuButton {
    display: block;
    width: 260px;
    padding: 15px;
    margin: 12px 0;

    border: 1px solid #168cff;
    background: rgba(0,80,180,0.18);

    color: white;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;

    cursor: pointer;
    transition: 0.3s;
}

.menuButton:hover {
    background: #0875e8;
    box-shadow: 0 0 25px #0875e8;
    transform: translateX(8px);
}

#exitButton {
    border-color: #ff4444;
}

/* PANELS */

.panel {
    position: fixed;
    inset: 0;
    z-index: 110;

    display: none;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #030817,
        #071c3c,
        #02040a
    );

    color: white;
    text-align: center;
}

.panelContent {
    width: 90%;
    max-width: 600px;
}

.panel h2 {
    font-size: 38px;
    margin-bottom: 20px;
    color: #168cff;
    letter-spacing: 4px;
}

.panel p {
    color: #b8c7df;
    margin: 15px;
}

.carOption {
    border: 1px solid #168cff;
    padding: 12px;
    margin: 12px auto;
    max-width: 450px;
    background: rgba(0,80,180,0.12);
    border-radius: 8px;
}

.carOption h3 {
    margin: 8px;
}

.carOption .menuButton {
    margin: 10px auto;
}

#selectedCarText {
    color: #00aaff;
    font-weight: bold;
    font-size: 18px;
}

/* LOADING */

#loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 200;

    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: #030817;
    color: white;
}

#loadingScreen h2 {
    font-size: 32px;
    letter-spacing: 5px;
    margin-bottom: 25px;
}

.loadingBar {
    width: 260px;
    height: 8px;
    background: #18243b;
    border-radius: 10px;
    overflow: hidden;
}

#loadingProgress {
    width: 0%;
    height: 100%;
    background: #168cff;
    box-shadow: 0 0 15px #168cff;
}

#loadingPercent {
    margin-top: 15px;
    color: #168cff;
}

/* MOBILE CONTROLS */

#mobileControls {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    z-index: 10;

    display: flex;
    justify-content: space-between;
    padding: 15px;

    pointer-events: none;
}

.controlGroup {
    display: flex;
    gap: 8px;
    pointer-events: auto;
}

.mobileButton {
    width: 58px;
    height: 58px;

    border-radius: 50%;
    border: 2px solid #168cff;

    background: rgba(0,20,50,0.7);
    color: white;

    font-size: 20px;
    font-weight: bold;
    touch-action: none;
}

.mobileButton:active {
    background: #0875e8;
}

@media (max-width: 600px) {

    h1 {
        font-size: 43px;
    }

    .menuButton {
        width: 220px;
    }

    .panel h2 {
        font-size: 28px;
    }

}

</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<!-- MAIN MENU -->

<div id="startScreen">

    <div class="menuContent">

        <div class="smallTitle">
            EXPERIENCE THE LEGEND
        </div>

        <h1>BUGATTI<br>CHIRON</h1>

        <div class="subtitle">
            CITY DRIVE
        </div>

        <button class="menuButton" id="playButton">
            ▶ PLAY GAME
        </button>

        <button class="menuButton" id="garageButton">
            🚘 GARAGE
        </button>

        <button class="menuButton" id="settingsButton">
            ⚙ SETTINGS
        </button>

        <button class="menuButton" id="nightButtonMenu">
            🌙 NIGHT MODE
        </button>

        <button class="menuButton" id="exitButton">
            ✖ EXIT
        </button>

    </div>

</div>

<!-- GARAGE -->

<div id="garagePanel" class="panel">

    <div class="panelContent">

        <h2>SELECT YOUR CAR</h2>

        <div class="carOption">

            <h3>🔵 BUGATTI CHIRON</h3>

            <button class="menuButton"
            onclick="selectGarageCar('bugatti')">
                SELECT BUGATTI
            </button>

        </div>

        <div class="carOption">

            <h3>🟡 LAMBORGHINI AVENTADOR</h3>

            <button class="menuButton"
            onclick="selectGarageCar('lamborghini')">
                SELECT LAMBORGHINI
            </button>

        </div>

        <div class="carOption">

            <h3>🔴 FERRARI 488</h3>

            <button class="menuButton"
            onclick="selectGarageCar('ferrari')">
                SELECT FERRARI
            </button>

        </div>

        <p id="selectedCarText">
            SELECTED: BUGATTI CHIRON
        </p>

        <button class="menuButton" id="garageBackButton">
            ← BACK
        </button>

    </div>

</div>

<!-- SETTINGS -->

<div id="settingsPanel" class="panel">

    <div class="panelContent">

        <h2>SETTINGS</h2>

        <p>GAME SETTINGS</p>

        <button class="menuButton" id="nightButtonSettings">
            🌙 TOGGLE NIGHT MODE
        </button>

        <button class="menuButton" id="settingsBackButton">
            ← BACK
        </button>

    </div>

</div>

<!-- LOADING -->

<div id="loadingScreen">

    <h2 id="loadingTitle">BUGATTI CHIRON</h2>

    <div class="loadingBar">
        <div id="loadingProgress"></div>
    </div>

    <div id="loadingPercent">0%</div>

    <p style="margin-top:20px;color:#8293b2;">
        LOADING CITY...
    </p>

</div>

<!-- MOBILE CONTROLS -->

<div id="mobileControls">

    <div class="controlGroup">

        <button class="mobileButton" id="leftButton">◀</button>

        <button class="mobileButton" id="rightButton">▶</button>

        <button class="mobileButton" id="cameraButton">C</button>

    </div>

    <div class="controlGroup">

        <button class="mobileButton" id="brakeButton">▼</button>

        <button class="mobileButton" id="gasButton">▲</button>

        <button class="mobileButton" id="nitroButton">⚡</button>

    </div>

</div>

<!-- GAME -->

<script type="module" src="./game.js"></script>

<!-- MENU FUNCTIONS -->

<script>

const startScreen =
document.getElementById("startScreen");

const garagePanel =
document.getElementById("garagePanel");

const settingsPanel =
document.getElementById("settingsPanel");

const loadingScreen =
document.getElementById("loadingScreen");

const loadingProgress =
document.getElementById("loadingProgress");

const loadingPercent =
document.getElementById("loadingPercent");

let chosenCar = "bugatti";

const carNames = {
    bugatti: "BUGATTI CHIRON",
    lamborghini: "LAMBORGHINI AVENTADOR",
    ferrari: "FERRARI 488"
};

/* GARAGE SELECTION */

function selectGarageCar(type) {

    chosenCar = type;

    document.getElementById("selectedCarText").textContent =
        "SELECTED: " + carNames[type];

    if (typeof window.selectCar === "function") {

        window.selectCar(type);

    } else {

        alert("Game is still loading. Please try again.");

    }
}

window.selectGarageCar = selectGarageCar;

/* PLAY GAME */

document.getElementById("playButton")
.addEventListener("click", function() {

    startScreen.style.display = "none";
    garagePanel.style.display = "none";
    settingsPanel.style.display = "none";

    loadingScreen.style.display = "flex";

    document.getElementById("loadingTitle").textContent =
        carNames[chosenCar];

    let progress = 0;

    const loadingTimer = setInterval(function() {

        progress += 2;

        loadingProgress.style.width =
            progress + "%";

        loadingPercent.textContent =
            progress + "%";

        if (progress >= 100) {

            clearInterval(loadingTimer);

            loadingScreen.style.display = "none";

        }

    }, 40);

});

/* GARAGE */

document.getElementById("garageButton")
.addEventListener("click", function() {

    startScreen.style.display = "none";
    garagePanel.style.display = "flex";

});

document.getElementById("garageBackButton")
.addEventListener("click", function() {

    garagePanel.style.display = "none";
    startScreen.style.display = "flex";

});

/* SETTINGS */

document.getElementById("settingsButton")
.addEventListener("click", function() {

    startScreen.style.display = "none";
    settingsPanel.style.display = "flex";

});

document.getElementById("settingsBackButton")
.addEventListener("click", function() {

    settingsPanel.style.display = "none";
    startScreen.style.display = "flex";

});

/* NIGHT MODE */

function changeNightMode() {

    if (typeof window.toggleNightMode === "function") {

        window.toggleNightMode();

    } else {

        alert("Night mode function was not found!");

    }

}

document.getElementById("nightButtonMenu")
.addEventListener("click", changeNightMode);

document.getElementById("nightButtonSettings")
.addEventListener("click", changeNightMode);

/* EXIT */

document.getElementById("exitButton")
.addEventListener("click", function() {

    alert("To exit the game, close this browser tab.");

});

</script>

</body><!-- PAUSE BUTTON -->
<button id="pauseButton">Ⅱ</button>

<!-- PAUSE MENU -->
<div id="pausePanel">
    <h1>GAME PAUSED</h1>

    <button id="resumeButton">▶ RESUME</button>
    <button id="mainMenuButton">🏠 MAIN MENU</button>
</div>

<style>
#pauseButton {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 9999;
    padding: 12px 20px;
    font-size: 22px;
    background: #0875e8;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#pausePanel {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(0,0,0,0.9);
    color: white;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
}

#pausePanel button {
    width: 220px;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</html>
